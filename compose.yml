services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buy2_hrms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      CI: "true"
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-buy2_hrms}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
